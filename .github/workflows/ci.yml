name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make schema-verify verify
      - uses: ./.github/actions/security-tools
      - run: make vulncheck
      - name: Build and test image
        run: |
          docker build --pull -t mobius:test .
          bash scripts/security/smoke.sh mobius:test
      - run: bash scripts/security/scan.sh image mobius:test reports/image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: reports/
