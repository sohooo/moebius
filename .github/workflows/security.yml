name: security
on:
  schedule:
    - cron: '23 5 * * *'
    - cron: '35 6 * * 1'
  workflow_dispatch:
concurrency:
  group: security-monitor
  cancel-in-progress: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SECURITY_MONITOR_ONLY: true
jobs:
  published-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/security-tools
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve supported release to immutable digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/sohooo/moebius
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')
          echo "IMAGE_REF=${IMAGE}@${digest}" >> "$GITHUB_ENV"
          mkdir -p reports
          printf '%s\n' "${IMAGE}:${tag}" "${IMAGE}@${digest}" > reports/scanned-image.txt
      - name: Scan published architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash scripts/security/scan.sh image "$IMAGE_REF" reports/image "linux/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-image-${{ matrix.arch }}
          path: reports/
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Collect reachable Go findings
        run: |
          mkdir -p reports
          source scripts/security/versions.env
          go run golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION" -json ./... > reports/govulncheck.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-security-report
          path: reports/
          if-no-files-found: error
  refreshed-image:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '35 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/security-tools
      - name: Rebuild current source with fresh OS packages
        run: |
          docker build --pull --no-cache -t mobius:weekly .
          bash scripts/security/smoke.sh mobius:weekly
          bash scripts/security/scan.sh image mobius:weekly reports/refreshed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: refreshed-image
          path: reports/
  notify:
    needs: [published-image, source, refreshed-image]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail on incomplete scans
        env:
          IMAGE_STATUS: ${{ needs.published-image.result }}
          SOURCE_STATUS: ${{ needs.source.result }}
          REFRESH_STATUS: ${{ needs.refreshed-image.result }}
        run: |
          test "$IMAGE_STATUS" = success
          test "$SOURCE_STATUS" = success
          test "$REFRESH_STATUS" = success || test "$REFRESH_STATUS" = skipped
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: reports
      - name: Compare findings and write summary
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/security/monitor.py reports monitor-state
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-monitor-state
          path: monitor-state/state.json
          retention-days: 90
          if-no-files-found: error
      - name: Alert on changed findings or weekly reminder
        if: steps.monitor.outputs.notify == 'true'
        run: |
          echo '::error::Security findings require attention. See the job summary and scan artifacts.'
          exit 1
