name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make schema-verify verify vulncheck
      - uses: ./.github/actions/security-tools
      - name: Build and scan release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in 'linux amd64' 'linux arm64' 'darwin amd64' 'darwin arm64'; do
            read -r os arch <<< "$target"
            out="release-binaries/mobius_${VERSION}_${os}_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/sohooo/moebius/internal/buildinfo.Version=${VERSION} -X github.com/sohooo/moebius/internal/buildinfo.Commit=${COMMIT} -X github.com/sohooo/moebius/internal/buildinfo.Date=${BUILD_DATE}" \
              -o "$out/mobius" ./cmd/mobius
            bash scripts/security/scan.sh rootfs "$out" "reports/${os}-${arch}"
            trivy convert --format cyclonedx --output "dist/${os}-${arch}.cdx.json" "reports/${os}-${arch}.json"
            tar -C "$out" -czf "dist/mobius_${VERSION}_${os}_${arch}.tar.gz" mobius
          done
          (cd dist && sha256sum *.tar.gz *.cdx.json > checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: binary-security-reports
          path: reports/
  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: ./.github/actions/security-tools
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build candidates, test and scan exact digests, then promote
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/sohooo/moebius
        run: |
          set -euo pipefail
          mkdir -p reports
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          refs=()
          for arch in amd64 arm64; do
            candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            docker buildx build --pull --platform "linux/$arch" --push \
              --tag "$candidate" --metadata-file "reports/build-${arch}.json" \
              --provenance=mode=max --sbom=true \
              --build-arg MOBIUS_VERSION="$VERSION" \
              --build-arg MOBIUS_COMMIT="$COMMIT" \
              --build-arg MOBIUS_BUILD_DATE="$BUILD_DATE" \
              --label "org.opencontainers.image.created=$BUILD_DATE" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.title=mobius" \
              --label "org.opencontainers.image.licenses=MIT" \
              --cache-from "type=gha,scope=$arch" --cache-to "type=gha,mode=max,scope=$arch" .
            digest=$(jq -er '."containerimage.digest"' "reports/build-${arch}.json")
            ref="${IMAGE}@${digest}"
            export DOCKER_DEFAULT_PLATFORM="linux/$arch"
            docker pull "$ref"
            bash scripts/security/smoke.sh "$ref"
            bash scripts/security/scan.sh image "$ref" "reports/${arch}" "linux/$arch"
            refs+=("$ref")
          done
          # Assemble a candidate index first; sign before exposing the release tag.
          candidate="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${IMAGE}@${digest}"
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}@${digest}"
          echo "${IMAGE}@${digest}" > reports/image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-reports
          path: reports/
  publish:
    needs: [verify, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: dist/
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign release checksums
        run: cosign sign-blob --yes --bundle dist/checksums.sigstore.json dist/checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
