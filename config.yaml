# Repository layout configuration for møbius.
# All paths are relative to the repository root unless noted otherwise.
layout:
  # Directory containing one folder per cluster.
  clusters_dir: clusters

  apps:
    # File names inside each cluster directory that define releases.
    # Earlier files have precedence over later files.
    files:
      - apps.yaml
      - apps-dev.yaml

    # møbius currently expects each file to be a top-level YAML list of objects.
    kind: list

    fields:
      # Key names used inside each release entry.
      name: name
      namespace: namespace
      project: project
      repoURL: repoURL
      chart: chart
      targetRevision: targetRevision

    required:
      # Canonical fields that must be present in each release entry.
      # Valid values are: name, namespace, project, repoURL, chart, targetRevision
      - name
      - namespace
      - chart

  overrides:
    # Primary override file path, relative to the cluster directory.
    # Available placeholders: {cluster}, {project}, {name}
    path: overrides/{project}/{name}.yaml

    # Optional compatibility fallback checked if the primary path does not exist.
    fallback_path: overrides/{name}.yaml

diff:
  ignore:
    # Built-in rules suppress common Helm metadata churn such as chart/version
    # labels and checksum annotations on resource and pod-template metadata.
    defaults: true
